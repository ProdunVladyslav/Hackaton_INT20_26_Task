services:
  postgres:
    image: postgres:16
    container_name: hackaton-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackaton_db
    ports:
      - "5252:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackaton-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hackaton_db;Username=postgres;Password=postgres
      - Claude__ApiKey=${Claude__ApiKey}
      - Claude__Model=${Claude__Model}
      - Claude__MaxTokens=${Claude__MaxTokens}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
